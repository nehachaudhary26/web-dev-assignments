<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Shop</h1><p>8 products</p></header>
  <main class="grid">
    <article class="card"><span class="badge">New</span><div class="thumb">&#127911;</div><h2>Headphones</h2><p class="price">&#8377;2,499</p><button>Buy</button></article>
    <article class="card"><div class="thumb">&#8986;</div><h2>Smart Watch</h2><p class="price">&#8377;3,299</p><button>Buy</button></article>
    <article class="card"><span class="badge sale">Sale</span><div class="thumb">&#128267;</div><h2>Power Bank</h2><p class="price">&#8377;1,199</p><button>Buy</button></article>
    <article class="card"><div class="thumb">&#9000;</div><h2>Keyboard</h2><p class="price">&#8377;1,899</p><button>Buy</button></article>
    <article class="card"><div class="thumb">&#128433;</div><h2>Mouse</h2><p class="price">&#8377;699</p><button>Buy</button></article>
    <article class="card"><div class="thumb">&#128247;</div><h2>Webcam</h2><p class="price">&#8377;1,599</p><button>Buy</button></article>
    <article class="card"><span class="badge">New</span><div class="thumb">&#128266;</div><h2>Speaker</h2><p class="price">&#8377;2,199</p><button>Buy</button></article>
    <article class="card"><div class="thumb">&#128187;</div><h2>Laptop Stand</h2><p class="price">&#8377;899</p><button>Buy</button></article>
  </main>
</body>
</html>

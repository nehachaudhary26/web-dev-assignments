<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="StudyTrack: a simple study planner that saves your tasks in your browser.">
  <title>StudyTrack - Study Planner</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#task-form">Skip to the form</a>
  <header class="site-header">
    <h1>StudyTrack</h1>
    <div class="header-actions">
      <button id="export-btn" class="btn ghost" type="button">Export JSON</button>
      <button id="theme-btn" class="btn ghost" type="button" aria-pressed="false">Dark mode</button>
    </div>
  </header>
  <main class="container">
    <section class="stats" aria-labelledby="stats-title">
      <h2 id="stats-title" class="sr-only">Progress</h2>
      <div class="stat"><span class="stat-num" id="stat-total">0</span><span>Total</span></div>
      <div class="stat"><span class="stat-num" id="stat-active">0</span><span>Active</span></div>
      <div class="stat"><span class="stat-num" id="stat-done">0</span><span>Done</span></div>
      <div class="stat warn"><span class="stat-num" id="stat-overdue">0</span><span>Overdue</span></div>
      <div class="progress-wrap"><progress id="progress" max="100" value="0" aria-label="Completion progress"></progress><span id="progress-text">0% complete</span></div>
    </section>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div class="layout">
      <section class="panel" aria-labelledby="form-heading">
        <h2 id="form-heading">Add a task</h2>
        <form id="task-form" novalidate>
          <label for="title">Title</label>
          <input id="title" maxlength="100" autocomplete="off" aria-describedby="title-error"><p id="title-error" class="error"></p>
          <label for="subject">Subject</label>
          <input id="subject" list="subject-options" placeholder="General" maxlength="40" autocomplete="off" aria-describedby="subject-error">
          <datalist id="subject-options"></datalist><p id="subject-error" class="error"></p>
          <div class="two-col">
            <div><label for="dueDate">Due date</label><input id="dueDate" type="date" aria-describedby="dueDate-error"><p id="dueDate-error" class="error"></p></div>
            <div><label for="priority">Priority</label><select id="priority" aria-describedby="priority-error"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select><p id="priority-error" class="error"></p></div>
          </div>
          <div class="btn-row"><button id="submit-btn" class="btn" type="submit">Add task</button><button id="cancel-edit" class="btn ghost" type="button" hidden>Cancel</button></div>
        </form>
      </section>
      <section class="panel" aria-labelledby="list-heading">
        <h2 id="list-heading">Your tasks</h2>
        <div class="filter-bar">
          <div><label for="filter-query">Search</label><input id="filter-query" type="search" placeholder="Title or subject"></div>
          <div><label for="filter-subject">Subject</label><select id="filter-subject"></select></div>
          <div><label for="filter-status">Status</label><select id="filter-status"><option value="all">All</option><option value="active">Active</option><option value="done">Done</option><option value="overdue">Overdue</option></select></div>
        </div>
        <ul id="task-list" class="task-list"></ul>
        <p id="empty" class="empty"></p>
        <button id="clear-done" class="btn ghost" type="button" hidden>Clear completed</button>
      </section>
    </div>
  </main>
  <footer class="site-footer"><p>StudyTrack saves data only in this browser. Export a JSON copy to keep a backup.</p></footer>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/state.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Photo Gallery</h1><p>Replace each tile with an &lt;img&gt; of your own photos.</p></header>
  <main class="gallery">
    <figure style="--a:#2d5be3;--b:#7b3fe4"><figcaption>Sunrise</figcaption></figure>
    <figure class="wide" style="--a:#f7971e;--b:#ffd200"><figcaption>Desert</figcaption></figure>
    <figure style="--a:#11998e;--b:#38ef7d"><figcaption>Forest</figcaption></figure>
    <figure class="tall" style="--a:#ee0979;--b:#ff6a00"><figcaption>Sunset</figcaption></figure>
    <figure style="--a:#00c6ff;--b:#0072ff"><figcaption>Ocean</figcaption></figure>
    <figure style="--a:#614385;--b:#516395"><figcaption>Night</figcaption></figure>
    <figure class="wide" style="--a:#134e5e;--b:#71b280"><figcaption>Hills</figcaption></figure>
    <figure style="--a:#cb356b;--b:#bd3f32"><figcaption>City</figcaption></figure>
  </main>
</body>
</html>

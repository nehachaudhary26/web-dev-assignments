<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <header class="topbar"><h1>Dashboard</h1><span>Welcome, Neha</span></header>
    <nav class="sidebar"><a href="#" class="active">Overview</a><a href="#">Projects</a><a href="#">Reports</a><a href="#">Settings</a></nav>
    <main class="content">
      <section class="stats">
        <div class="stat"><span>Projects</span><strong>12</strong></div>
        <div class="stat"><span>Tasks Done</span><strong>48</strong></div>
        <div class="stat"><span>Hours Learned</span><strong>126</strong></div>
        <div class="stat"><span>Certificates</span><strong>6</strong></div>
      </section>
      <section class="panel chart"><h2>Weekly Progress</h2>
        <div class="bars"><i style="--h:40%"></i><i style="--h:65%"></i><i style="--h:50%"></i><i style="--h:85%"></i><i style="--h:70%"></i><i style="--h:95%"></i><i style="--h:60%"></i></div>
      </section>
      <section class="panel"><h2>Recent Activity</h2>
        <ul><li>Finished Day 2 assignments</li><li>Pushed code to GitHub</li><li>Started JavaScript basics</li></ul>
      </section>
    </main>
    <footer class="footer">&copy; 2026 Dashboard Demo</footer>
  </div>
</body>
</html>
